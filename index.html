<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --serif:'Newsreader','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --paper:#EBE8E0;--leaf:#F5F3EE;--ink:#23211D;--ink-2:#56524A;--ink-3:#7E7970;
  --rule:#D3CEC2;--accent:#33564A;--accent-ink:#F3F1EC;--accent-soft:#D8E3DC;--warn:#9A3B2B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#181916;--leaf:#20211D;--ink:#E6E1D5;--ink-2:#B4AD9F;--ink-3:#8A857A;
    --rule:#373830;--accent:#95BAA6;--accent-ink:#141512;--accent-soft:#26332C;--warn:#E09A88;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#181916;--leaf:#20211D;--ink:#E6E1D5;--ink-2:#B4AD9F;--ink-3:#8A857A;
  --rule:#373830;--accent:#95BAA6;--accent-ink:#141512;--accent-soft:#26332C;--warn:#E09A88;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1:focus{outline:none}

.wrap{max-width:640px;margin:0 auto;padding:28px 22px 80px}
.tabs{display:flex;gap:6px;font-family:var(--sans);font-size:15px;margin-bottom:44px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:10px 14px 12px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.date{font-family:var(--sans);font-size:14px;color:var(--ink-3);margin:0 0 4px}
h1{font-weight:400;font-size:clamp(2rem,6vw,2.6rem);line-height:1.15;margin:0 0 8px;letter-spacing:-.01em}
h2{font-weight:500;font-size:1.25rem;margin:0 0 4px}
h3{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.hint{color:var(--ink-3);font-size:.95rem;margin:0 0 16px;font-style:italic}
section{margin-top:44px}
.sub{margin-top:28px}

/* lists of steps */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.list li:first-child{border-top:1px solid var(--rule)}
.body{flex:1;min-width:0}
.t{display:block;word-break:break-word}
.list li.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.mrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;font-family:var(--sans);font-size:13px;line-height:1.5;margin-top:2px}
.mrow:empty{display:none}
.tag{color:var(--accent)}
.tag::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.acts{display:flex;gap:14px;margin-left:auto}
.pill{display:inline-block;font-family:var(--sans);font-size:12px;font-weight:500;line-height:1;padding:4px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.check{appearance:none;flex:none;width:22px;height:22px;margin:4px 0 0;border:1.5px solid var(--ink-3);border-radius:50%;cursor:pointer;display:grid;place-items:center;background:var(--leaf)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.x{background:none;border:0;color:var(--ink-3);font-family:var(--sans);font-size:13px;padding:2px 0;white-space:nowrap}
.x:hover,.x:focus-visible{color:var(--ink)}
.x.go{color:var(--accent);font-weight:500}

/* forms */
.add{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.field{flex:1;min-width:0;background:var(--leaf);border:1px solid var(--rule);border-radius:10px;padding:11px 14px;font-size:1rem}
.field::placeholder{color:var(--ink-3)}
.field:focus{outline:none;border-color:var(--accent)}
select.field{flex:none;width:auto;max-width:100%;font-family:var(--sans);font-size:15px}
input[type=date].field{font-family:var(--sans);font-size:15px}
textarea.field{width:100%;resize:vertical;min-height:72px;line-height:1.5}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font-family:var(--sans);font-size:15px;font-weight:500}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.fl{display:block;margin-bottom:14px}
.fl>span{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-bottom:5px}
.fl .field{width:100%}

  display:flex;gap:18px;align-items:center;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;
  font-family:var(--sans);font-size:15px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:10}

<script>
/* =====================================================================
   SETUP — your Supabase project details (see README.md).
   Leave both blank to keep everything on this device only.
   Use the publishable (or "anon") key. NEVER the secret / service_role key.
   ===================================================================== */
const SUPABASE_URL = 'https://ykipiudpvliomkpnofcq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1K-U5AGTc-vRFNj50fRJgQ__dyJhKzL';

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parseISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function weekKey(s=today()){
  const d=parseISO(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return `${t.getUTCFullYear()}-W${pad(Math.ceil(((t-y0)/864e5+1)/7))}`;
}
function weekStart(key){const [y,w]=key.split('-W').map(Number);const j4=new Date(y,0,4);const dow=j4.getDay()||7;return new Date(y,0,4-dow+1+(w-1)*7)}
const shiftWeek=(k,n)=>weekKey(iso(addDays(weekStart(k),7*n)));
const weekLabel=k=>{const d=weekStart(k);return `Week of ${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}`};
const fmtD=s=>{if(!s)return '';const d=parseISO(s);return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
const $=s=>document.querySelector(s);

const AREAS=[
  ['presence','Inner life'],['career','Work'],['education','Education'],['health','Health'],
  ['money','Money'],['intellect','Reading & creating'],['ordinary','Relationships']
];
const areaName=id=>(AREAS.find(a=>a[0]===id)||['','Other'])[1];
const TODAY_MAX=3;

/* ---------- data ----------
   goals: where you're headed       {id,text,area,why,due,done,doneDate}
   steps: the actions that get there {id,text,goalId,week,day,done,doneDate}
     week = 'YYYY-Www' when planned into a week, day = 'YYYY-MM-DD' when picked for a day.
   A step is one object, so ticking it in Today also ticks it in This week and in its goal. */
const KEY='the-study:simple:v1', OLD_KEY='the-study:v1';
function fresh(){return {v:2,name:'',goals:[],steps:[],weeks:{},meta:{updatedAt:0,owner:null}}}
const mkStep=(text,goalId,week='',day='')=>({id:uid(),text,goalId:goalId||null,week,day,done:false,doneDate:''});

function fromV0(old){ // the earliest, bigger version
  if(!old||!old.state)return null;
  const o=old.state,s={name:(o.settings&&o.settings.name)||'',today:{date:'',items:[]},weeks:{},goals:[]};
  if(o.today&&Array.isArray(o.today.items))s.today={date:o.today.date||'',items:o.today.items.map(i=>({id:i.id||uid(),text:i.text,done:!!i.done}))};
  for(const [k,w] of Object.entries(o.weeks||{}))s.weeks[k]={p1:w.p1||'',p2:w.p2||'',p3:w.p3||'',p1done:!!w.p1done,p2done:!!w.p2done,p3done:!!w.p3done,
    good:[w.r_done,w.r_joy].filter(Boolean).join('\n'),hard:w.r_hard||'',next:w.r_carry||''};
  if(Array.isArray(o.goals))s.goals=o.goals.filter(x=>!x.archived&&x.status!=='nolonger'&&x.title)
    .map(x=>({id:x.id||uid(),text:x.title,area:x.area||'ordinary',done:x.status==='completed',doneDate:x.status==='completed'?(x.completedDate||''):''}));
  return fromV1(s);
}
function fromV1(s){ // the version with fixed "priority 1-3" boxes
  const out=fresh();
  out.name=typeof s.name==='string'?s.name:'';
  out.goals=(Array.isArray(s.goals)?s.goals:[]).filter(g=>g&&g.text).map(g=>({id:g.id||uid(),text:g.text,area:g.area||'ordinary',why:g.why||'',due:g.due||'',done:!!g.done,doneDate:g.doneDate||''}));
  for(const [k,w] of Object.entries(s.weeks||{})){
    out.weeks[k]={good:w.good||'',hard:w.hard||'',next:w.next||''};
    for(const n of [1,2,3])if(w['p'+n]&&String(w['p'+n]).trim()){
      const st=mkStep(String(w['p'+n]).trim(),null,k);st.done=!!w['p'+n+'done'];out.steps.push(st);
    }
  }
  const t=s.today;
  if(t&&t.date&&Array.isArray(t.items))for(const i of t.items)if(i&&i.text){
    const st=mkStep(i.text,null,weekKey(t.date),t.date);st.done=!!i.done;st.doneDate=i.done?t.date:'';out.steps.push(st);
  }
  out.meta={...out.meta,...(s.meta||{})};
  return out;
}
function normalize(s){
  if(!s||typeof s!=='object')return null;
  if(s.state&&!s.goals&&!s.weeks)return fromV0(s);
  if(s.v!==2)return fromV1(s);
  const f=fresh();
  return {v:2,name:typeof s.name==='string'?s.name:'',
    goals:Array.isArray(s.goals)?s.goals.filter(Boolean):[],
    steps:Array.isArray(s.steps)?s.steps.filter(Boolean):[],
    weeks:s.weeks&&typeof s.weeks==='object'?s.weeks:{},
    meta:{...f.meta,...(s.meta||{})}};
}
function loadLocal(){
  let s=null;
  try{s=normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){}
  if(!s){try{s=fromV0(JSON.parse(localStorage.getItem(OLD_KEY)||'null'))}catch(e){}}
  return s||fresh();
}
let state=loadLocal();

// touch=false is for housekeeping that shouldn't count as an edit.
function save(touch=true){
  if(touch)state.meta.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(touch)schedulePush();
}

const goalById=id=>id?state.goals.find(g=>g.id===id):null;
const stepById=id=>state.steps.find(s=>s.id===id);
const activeGoals=()=>state.goals.filter(g=>!g.done);
const stepsOf=gid=>state.steps.filter(s=>s.goalId===gid);
const todaySteps=()=>{const td=today();return state.steps.filter(s=>s.day===td)};
function score(k){const ss=state.steps.filter(s=>s.week===k);return {done:ss.filter(s=>s.done).length,total:ss.length}}
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* ---------- account sync (Supabase) ---------- */
const CLOUD=!!(SUPABASE_URL&&SUPABASE_KEY);
let sb=null,user=null,pushTimer=null,pushing=false,pushAgain=false,syncState='local';
const STATUS={
  local:'Saved on this device only.',
  syncing:'Saving…',
  synced:'Saved to your account.',
  offline:'Offline. Changes are saved on this device and will sync when you’re back online.',
  error:'Couldn’t reach your account. Changes are saved on this device and will sync on the next try.',
  setup:'Signed in, but the planner table isn’t set up yet. Run supabase.sql in your Supabase project.'
};
function setStatus(k){
  syncState=k;const el=$('#status');
  el.textContent=STATUS[k];el.classList.toggle('bad',k==='error'||k==='setup');
}
function syncError(e){
  const m=String(e&&(e.message||e.code)||'');
  setStatus(/planner|relation|schema cache|PGRST205|42P01/i.test(m)?'setup':navigator.onLine?'error':'offline');
}
async function pushNow(){
  if(!sb||!user)return;
  clearTimeout(pushTimer);
  if(pushing){pushAgain=true;return}
  pushing=true;setStatus('syncing');
  try{
    const {error}=await sb.from('planner').upsert({user_id:user.id,data:state,updated_at:new Date().toISOString()});
    if(error)throw error;
    setStatus('synced');
  }catch(e){syncError(e)}
  finally{pushing=false;if(pushAgain){pushAgain=false;await pushNow()}}
}
function schedulePush(){
  if(!sb||!user)return;
  clearTimeout(pushTimer);setStatus('syncing');pushTimer=setTimeout(pushNow,900);
}
async function syncNow(){
  if(!sb||!user)return;
  try{
    setStatus('syncing');
    const {data,error}=await sb.from('planner').select('data').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    const remote=data?normalize(data.data):null;
    const lt=state.meta.updatedAt||0, rt=remote?(remote.meta.updatedAt||0):-1;
    if(remote&&rt>lt){
      state=remote;state.meta.owner=user.id;save(false);fillSettings();render();setStatus('synced');
    }else if(!remote||lt>rt||data.data.v!==2){await pushNow()}
    else setStatus('synced');
  }catch(e){syncError(e)}
}

/* ---------- small pieces ---------- */
let tab='today',wk=weekKey(),mode='loading',lastTab=null,lastGoal='',focusAfter=null;
const openGoals=new Set();
try{const t=sessionStorage.getItem('study-tab');if(['today','week','goals','progress'].includes(t))tab=t}catch(e){}
const app=$('#app'),tabsEl=$('.tabs');

function goalSelect(form){
  const gs=activeGoals();if(!gs.length)return '';
  const sel=gs.some(g=>g.id===lastGoal)?lastGoal:'';
  return `<select class="field" name="goal" data-goalsel aria-label="Which goal does this serve?">
    <option value="">Not tied to a goal</option>${gs.map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(short(g.text,42))}</option>`).join('')}</select>`;
}
function tagFor(s){const g=goalById(s.goalId);return g?`<span class="tag">${esc(short(g.text,60))}</span>`:''}
function stepRow(s,{tag=true,acts=''}={}){
  return `<li class="${s.done?'done':''}"><input type="checkbox" class="check" data-act="sToggle" data-id="${s.id}" ${s.done?'checked':''} aria-label="Done: ${esc(s.text)}">
    <div class="body"><span class="t">${esc(s.text)}</span><div class="mrow">${tag?tagFor(s):''}${acts?`<span class="acts">${acts}</span>`:''}</div></div></li>`;
}
const btn=(act,id,label,cls='x',extra='')=>`<button class="${cls}" data-act="${act}" data-id="${id}" ${extra}>${label}</button>`;
const pickBtn=(s,act,label,extra='')=>`<button class="pick" data-act="${act}" data-id="${s.id}" ${extra} aria-label="${label}: ${esc(s.text)}"><span class="body"><span class="t">${esc(s.text)}</span><span class="mrow">${tagFor(s)}</span></span><span class="plus">${label}</span></button>`;
const bar=(d,t,label)=>`<div class="bar" role="img" aria-label="${label||`${d} of ${t} done`}"><i style="width:${pct(d,t)}%"></i></div>`;

/* ---------- Today ---------- */
function vToday(){
  const td=today(),cw=weekKey(),d=new Date(),h=d.getHours();
  const hello=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  const items=todaySteps(),room=items.length<TODAY_MAX;
  const picks=state.steps.filter(s=>s.week===cw&&!s.done&&!s.day);
  const left=state.steps.filter(s=>s.day&&s.day<td&&!s.done);
  const ws=score(cw);
  return `<p class="date">${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}</p>
  <h1 tabindex="-1">${hello}${state.name?', '+esc(state.name):''}.</h1>
  ${ws.total?`<div class="path"><button class="link" data-act="goTab" data-t="week">This week</button><span>${ws.done} of ${ws.total} steps done</span>${bar(ws.done,ws.total)}</div>`:''}
  <section>
    <h2>Today’s focus</h2>
    <p class="hint">Up to three steps. Pick from this week’s plan, or add one.</p>
    ${items.length?`<ul class="list">${items.map(s=>stepRow(s,{acts:s.done?'':btn('sNotToday',s.id,'Not today')})).join('')}</ul>`:''}
    ${room?`
      ${picks.length?`<div class="sub"><h3>From this week’s plan</h3><div class="picks">${picks.slice(0,6).map(s=>pickBtn(s,'sToday','Do today')).join('')}</div></div>`:''}
      <form class="add${state.goals.some(g=>!g.done)?' wide':''}" data-form="tAdd"><input class="field" name="text" maxlength="160" placeholder="${items.length?'Another step, if it matters':'A small step you’ll do today'}" aria-label="Add a step for today">${goalSelect()}<button class="btn">Add</button></form>`
    :`<p class="hint" style="margin-top:14px">Three is plenty. Finish one or set it aside to make room.</p>`}
    ${left.length?`<div class="sub"><h3>Still open from earlier</h3><ul class="list">${left.map(s=>stepRow(s,{acts:(room?btn('sToday',s.id,'Do today','x go'):'')+btn('sNotToday',s.id,'Back to the week')})).join('')}</ul></div>`:''}
  </section>
  ${!state.goals.length?`<div class="intro">
    <h2>Start with a goal</h2>
    <ol>
      <li>In <b>Goals</b>, write what you’re working toward and why it matters.</li>
      <li>Break each goal into small, concrete steps.</li>
      <li>In <b>This week</b>, plan a few of those steps.</li>
      <li>Here, pick up to three to do today.</li>
    </ol>
    <button class="btn" data-act="goTab" data-t="goals">Set your first goal</button>
  </div>`:''}`;
}

/* ---------- This week ---------- */
function vWeek(){
  const cw=weekKey(),isNow=wk===cw,td=today();
  const w=state.weeks[wk]||{},prevK=shiftWeek(wk,-1),prev=state.weeks[prevK]||{};
  const steps=state.steps.filter(s=>s.week===wk),sc=score(wk);
  const acts=s=>{
    if(s.done)return '';
    let a='';
    if(isNow)a+=s.day===td?`<span class="pill">Today</span>`:btn('sToday',s.id,'Do today','x go');
    return a+btn('sUnweek',s.id,s.goalId&&goalById(s.goalId)?'Not this week':'Remove');
  };
  const groups=[];
  for(const g of state.goals){const ss=steps.filter(s=>s.goalId===g.id);if(ss.length)groups.push([g.text,ss])}
  const loose=steps.filter(s=>!goalById(s.goalId));if(loose.length)groups.push([null,loose]);
  const idle=activeGoals().filter(g=>!steps.some(s=>s.goalId===g.id));
  const carry=state.steps.filter(s=>s.week===prevK&&!s.done);
  const q=(label,key,ph)=>`<label class="q"><span>${label}</span><textarea class="field" data-wbind="${key}" rows="2" placeholder="${ph}">${esc(w[key]||'')}</textarea></label>`;
  return `<div class="weeknav"><button data-act="wShift" data-n="-1">Previous week</button>${!isNow?`<button data-act="wNow">Back to this week</button>`:''}<button data-act="wShift" data-n="1">Next week</button></div>
  <h1 tabindex="-1">${isNow?'This week':weekLabel(wk)}</h1>
  ${isNow?`<p class="date">${weekLabel(wk)}</p>`:''}
  ${sc.total?`<div class="path"><span>${sc.done} of ${sc.total} steps done</span>${bar(sc.done,sc.total)}<span class="num">${pct(sc.done,sc.total)}%</span></div>`:''}
  <section>
    <h2>The plan</h2>
    <p class="hint">A handful of steps that move your goals forward. Three to five makes a strong week.</p>
    ${prev.next&&prev.next.trim()?`<p class="lastweek"><em>Last week you wanted to bring in</em>${esc(prev.next).replace(/\n/g,'<br>')}</p>`:''}
    ${groups.length?groups.map(([name,ss])=>`<div class="group"><h3>${name?esc(name):'Not tied to a goal'}</h3><ul class="list">${ss.map(s=>stepRow(s,{tag:false,acts:acts(s)})).join('')}</ul></div>`).join('')
      :`<p class="empty">Nothing planned yet. Pick steps from your goals below, or add one.</p>`}
    <form class="add${state.goals.some(g=>!g.done)?' wide':''}" data-form="wAdd"><input class="field" name="text" maxlength="160" placeholder="Add a step to this week" aria-label="Add a step to this week">${goalSelect()}<button class="btn">Add</button></form>
  </section>
  ${idle.length?`<section>
    <h2>Goals with nothing planned</h2>
    <p class="hint">Not every goal needs a step every week, but this is where to check.</p>
    ${idle.map(g=>{const ready=stepsOf(g.id).filter(s=>!s.done&&s.week!==wk&&!(s.week&&s.week>wk));
      return `<div class="group"><h3>${esc(g.text)}</h3>
        ${ready.length?`<div class="picks">${ready.slice(0,3).map(s=>pickBtn(s,'sWeek','Plan it',`data-w="${wk}"`)).join('')}</div>`:''}
        <p class="mrow" style="margin-top:8px"><button class="link" data-act="planFor" data-id="${g.id}">Write a new step for this goal</button></p></div>`}).join('')}
  </section>`:''}
  ${carry.length?`<section>
    <h2>Unfinished last week</h2>
    <p class="hint">Bring forward what still matters. Leave the rest.</p>
    <ul class="list">${carry.map(s=>stepRow(s,{acts:btn('sCarry',s.id,'Move to this week','x go')})).join('')}</ul>
  </section>`:''}
  <section>
    <h2>End-of-week check-in</h2>
    <p class="hint">Whenever you get to it.</p>
    ${q('What went well?','good','Big or small')}
    ${q('What was hard?','hard','It’s fine to be honest here')}
    ${q('What do I want to bring into next week?','next','Anything worth keeping')}
  </section>`;
}

/* ---------- Goals ---------- */
function goalBlock(g){
  const ss=stepsOf(g.id),d=ss.filter(s=>s.done).length,next=ss.find(s=>!s.done),open=openGoals.has(g.id),cw=weekKey(),td=today();
  const meta=[ss.length?`${d} of ${ss.length} steps done`:'No steps yet',g.due&&!g.done?`by ${fmtD(g.due)}`:'',g.done?`achieved ${fmtD(g.doneDate)}`:''].filter(Boolean).join(', ');
  const stepActs=s=>{
    if(s.done)return '';
    const st=s.day===td?`<span class="pill">Today</span>`:s.week===cw?`<span class="pill">This week</span>`+btn('sToday',s.id,'Do today','x go')
      :btn('sWeek',s.id,'Plan this week','x go');
    return st+btn('sRemove',s.id,'Remove');
  };
  const ordered=ss.filter(s=>!s.done).concat(ss.filter(s=>s.done));
  return `<article class="goal${g.done?' done':''}">
    <button class="ghead" data-act="gOpen" data-id="${g.id}" aria-expanded="${open}">
      <span class="gtx"><span class="gt">${esc(g.text)}</span>
        <span class="gmeta">${esc(meta)}${next&&!open&&!g.done?`<br>Next: <b>${esc(short(next.text,70))}</b>`:''}</span>
        ${g.why&&!open&&!g.done?`<span class="gwhy">${esc(short(g.why,120))}</span>`:''}
        ${ss.length&&!g.done?`<span class="mini"><i style="width:${pct(d,ss.length)}%"></i></span>`:''}</span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    ${open?`<div class="gbody">
      <h3 style="margin-top:6px">Steps</h3>
      <p class="hint">Concrete actions you could finish in a sitting or a day. Plan them into a week when you’re ready.</p>
      ${ordered.length?`<ul class="list">${ordered.map(s=>stepRow(s,{tag:false,acts:stepActs(s)})).join('')}</ul>`:''}
      <form class="add" data-form="sAdd" data-goal="${g.id}"><input class="field" name="text" maxlength="160" placeholder="${ss.length?'Another step':'First step, e.g. “Book the exam date”'}" aria-label="Add a step to this goal"><button class="btn">Add step</button></form>
      <h3>Details</h3>
      <label class="fl"><span>Goal</span><input class="field" data-gbind="text" data-id="${g.id}" value="${esc(g.text)}" maxlength="200"></label>
      <label class="fl"><span>Why it matters</span><textarea class="field" data-gbind="why" data-id="${g.id}" rows="2" placeholder="The reason to come back to on a hard day">${esc(g.why||'')}</textarea></label>
      <div class="grid2">
        <label class="fl"><span>Life area</span><select class="field" data-gbind="area" data-id="${g.id}">${AREAS.map(([id,n])=>`<option value="${id}" ${id===g.area?'selected':''}>${n}</option>`).join('')}</select></label>
        <label class="fl"><span>Aim to finish by (optional)</span><input type="date" class="field" data-gbind="due" data-id="${g.id}" value="${esc(g.due||'')}"></label>
      </div>
      <div class="gfoot">
        ${btn('gDone',g.id,g.done?'Reopen goal':'Mark goal achieved','btn quiet')}
        ${btn('gRemove',g.id,'Delete goal')}
      </div>
    </div>`:''}
  </article>`;
}
function vGoals(){
  const areas=AREAS.filter(([id])=>state.goals.some(g=>g.area===id));
  const stray=state.goals.filter(g=>!AREAS.some(a=>a[0]===g.area));
  const list=gs=>gs.slice().sort((a,b)=>a.done-b.done).map(goalBlock).join('');
  return `<h1 tabindex="-1">Goals</h1>
  <p class="hint" style="margin-top:6px">Where you’re headed. Open a goal to break it into steps you can plan into your week.</p>
  <form class="add" data-form="gAdd"><input class="field" name="text" maxlength="200" placeholder="A goal you’re working toward" aria-label="New goal">
    <select class="field" name="area" aria-label="Life area">${AREAS.map(([id,n])=>`<option value="${id}">${n}</option>`).join('')}</select>
    <button class="btn">Add goal</button></form>
  ${areas.length||stray.length?areas.map(([id,name])=>`<div class="area"><h3>${name}</h3>${list(state.goals.filter(g=>g.area===id))}</div>`).join('')
    +(stray.length?`<div class="area"><h3>Other</h3>${list(stray)}</div>`:'')
  :`<p class="empty" style="margin-top:12px">No goals yet. Write one above. Something you’d be glad to have done in three months is a good size.</p>`}`;
}

/* ---------- Progress ---------- */
function vProgress(){
  const cw=weekKey(),sc=score(cw);
  const achieved=state.goals.filter(g=>g.done).sort((a,b)=>(b.doneDate||'').localeCompare(a.doneDate||''));
  const allDone=state.steps.filter(s=>s.done).length;
  const weeks=[];for(let i=0;i<8;i++)weeks.push(shiftWeek(cw,-i));
  const active=activeGoals();
  return `<h1 tabindex="-1">Progress</h1>
  <p class="hint" style="margin-top:6px">Everything you’ve moved forward, in one place.</p>
  <div class="tally">
    <div><b>${sc.total?pct(sc.done,sc.total)+'%':'–'}</b><span>of this week’s plan done</span></div>
    <div><b>${allDone}</b><span>step${allDone===1?'':'s'} finished</span></div>
    <div><b>${achieved.length}</b><span>goal${achieved.length===1?'':'s'} achieved</span></div>
  </div>
  <section>
    <h2>Week by week</h2>
    <p class="hint">How much of each week’s plan you finished. Around 85% is a strong week; nobody needs 100%.</p>
    <div class="bars">${weeks.map(k=>{const s=score(k);
      return `<span class="num" style="font-size:14px">${k===cw?'This week':weekLabel(k).replace('Week of ','')}</span>${s.total?bar(s.done,s.total):'<div class="bar" aria-label="Nothing planned"></div>'}<span class="num">${s.total?`${s.done} of ${s.total}`:'No plan'}</span>`}).join('')}</div>
  </section>
  <section>
    <h2>By goal</h2>
    ${active.length?`<div class="bars">${active.map(g=>{const ss=stepsOf(g.id),d=ss.filter(s=>s.done).length;
      return `<span class="lbl" title="${esc(g.text)}">${esc(g.text)}</span>${bar(d,ss.length)}<span class="num">${ss.length?`${d} of ${ss.length}`:'No steps'}</span>`}).join('')}</div>`
      :`<p class="empty">Add a goal and its steps, and progress shows up here.</p>`}
  </section>
  <section>
    <h2>Achieved</h2>
    ${achieved.length?`<ul class="list wins" style="margin-top:14px">${achieved.map(g=>`<li><span class="when">${fmtD(g.doneDate)||'Earlier'}</span><div class="body"><span class="t">${esc(g.text)}</span><div class="mrow"><span class="num">${areaName(g.area)}, ${stepsOf(g.id).filter(s=>s.done).length} steps</span></div></div></li>`).join('')}</ul>`
      :`<p class="empty">Nothing achieved yet. When you mark a goal achieved, it lands here with the date.</p>`}
  </section>`;
}

function vSignIn(msg){
  return `<div class="enter"><h1 tabindex="-1">The Study</h1>
  <p class="hint" style="margin-top:6px">Sign in to open your plans.</p>
  <form class="signin" data-form="signIn">
    <label class="q"><span>Email</span><input class="field" type="email" name="email" autocomplete="username" required></label>
    <label class="q"><span>Password</span><input class="field" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn">Sign in</button>
    <p class="err" role="alert">${msg?esc(msg):''}</p>
  </form></div>`;
}

/* ---------- rendering ---------- */
function focusInfo(){
  const el=document.activeElement;
  if(!el||!app.contains(el))return null;
  const parts=[...el.attributes].filter(a=>a.name.startsWith('data-')).map(a=>`[${a.name}="${CSS.escape(a.value)}"]`);
  if(el.name)parts.push(`[name="${CSS.escape(el.name)}"]`);
  if(!parts.length){const f=el.closest('form[data-form]');if(f&&el.tagName==='BUTTON')return {q:`form[data-form="${f.dataset.form}"]${f.dataset.goal?`[data-goal="${f.dataset.goal}"]`:''} input[name=text]`}; return null}
  let sel=null;try{if(typeof el.selectionStart==='number')sel=[el.selectionStart,el.selectionEnd]}catch(e){}
  return {q:el.tagName.toLowerCase()+parts.join(''),sel};
}
function render(){
  if(mode!=='app')return;
  tabsEl.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===tab;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
  const f=focusInfo();
  const enter=lastTab!==tab;lastTab=tab;
  app.innerHTML=`<div class="view${enter?' enter':''}">${tab==='today'?vToday():tab==='week'?vWeek():tab==='goals'?vGoals():vProgress()}</div>`;
  const target=focusAfter||(f&&f.q);focusAfter=null;
  if(target){
    const n=app.querySelector(target);
    if(n){n.focus({preventScroll:!focusAfter&&!!f});if(f&&f.sel&&target===f.q)try{n.setSelectionRange(f.sel[0],f.sel[1])}catch(e){}}
    else{const h=app.querySelector('h1');if(h)h.focus({preventScroll:true})}
  }
}
function fillSettings(){
  $('#nameField').value=state.name||'';
  $('#account').hidden=!user;
  if(user)$('#who').textContent=user.email||'your account';
}
function showApp(){mode='app';tabsEl.hidden=false;$('#foot').hidden=false;fillSettings();render()}
function showSignIn(msg){mode='signin';tabsEl.hidden=true;$('#foot').hidden=true;hideToast();app.innerHTML=vSignIn(msg)}

/* ---------- undo ---------- */
let undoFn=null,toastTimer=null;
function toast(msg,undo){
  const t=$('#toast');undoFn=undo||null;
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button class="link" type="button" data-undo>Undo</button>':''}`;
  t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,7000);
}
function hideToast(){$('#toast').hidden=true;undoFn=null}
$('#toast').addEventListener('click',e=>{
  if(!e.target.closest('[data-undo]')||!undoFn)return;
  undoFn();save();render();hideToast();
});
function snapshot(){const s=JSON.stringify({g:state.goals,s:state.steps});return ()=>{const x=JSON.parse(s);state.goals=x.g;state.steps=x.s}}

/* ---------- actions ---------- */
function selectTab(t,focus){
  tab=t;try{sessionStorage.setItem('study-tab',tab)}catch(e){}
  if(t==='week')wk=weekKey();
  render();window.scrollTo(0,0);if(focus)tabsEl.querySelector(`[data-tab="${t}"]`).focus();
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)selectTab(b.dataset.tab)});
tabsEl.addEventListener('keydown',e=>{
  const ids=['today','week','goals','progress'];let i=ids.indexOf(tab);
  if(e.key==='ArrowRight')i=(i+1)%4;else if(e.key==='ArrowLeft')i=(i+3)%4;
  else if(e.key==='Home')i=0;else if(e.key==='End')i=3;else return;
  e.preventDefault();selectTab(ids[i],true);
});
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const id=el.dataset.id,s=id&&stepById(id),g=id&&goalById(id);
  const acts={
    sToggle(){if(s){s.done=!s.done;s.doneDate=s.done?today():''}},
    sToday(){
      if(!s)return 'view';
      if(todaySteps().filter(x=>x.id!==s.id).length>=TODAY_MAX){toast('Today already has three steps. Finish or set one aside first.');return 'view'}
      s.day=today();s.week=weekKey();
    },
    sNotToday(){if(s)s.day=''},
    sWeek(){if(s){s.week=el.dataset.w||weekKey();s.day=''}},
    sCarry(){if(s){s.week=wk;s.day=''}},
    sUnweek(){
      if(!s)return;const goal=goalById(s.goalId);
      if(goal){const u=snapshot();s.week='';s.day='';toast(`Moved back to “${short(goal.text,30)}”`,u)}
      else{const u=snapshot();state.steps=state.steps.filter(x=>x!==s);toast(`Removed “${short(s.text,30)}”`,u)}
    },
    sRemove(){if(s){const u=snapshot();state.steps=state.steps.filter(x=>x!==s);toast(`Removed “${short(s.text,30)}”`,u)}},
    gOpen(){if(g){const was=openGoals.has(g.id);openGoals.clear();if(!was)openGoals.add(g.id)}return 'view'},
    gDone(){
      if(!g)return;g.done=!g.done;g.doneDate=g.done?today():'';
      if(g.done){openGoals.delete(g.id);toast('Goal achieved. You’ll find it in Progress.')}
    },
    gRemove(){
      if(!g)return;const u=snapshot();
      state.steps=state.steps.filter(x=>x.goalId!==g.id||x.week||x.done); // drop unplanned steps
      state.steps.forEach(x=>{if(x.goalId===g.id)x.goalId=null});       // keep planned/finished ones as history
      state.goals=state.goals.filter(x=>x!==g);openGoals.delete(g.id);
      toast(`Deleted “${short(g.text,30)}”`,u);
    },
    planFor(){lastGoal=id;focusAfter='[data-form="wAdd"] input[name=text]';return 'view'},
    goTab(){selectTab(el.dataset.t);return 'none'},
    wShift(){wk=shiftWeek(wk,+el.dataset.n);return 'view'},
    wNow(){wk=weekKey();return 'view'}
  };
  const a=acts[el.dataset.act];if(!a)return;
  const r=a();if(r==='none')return;if(r!=='view')save();render();
});
app.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;const val=n=>{const x=f.querySelector(`[name=${n}]`);return x?x.value:''};
  if(f.dataset.form==='signIn'){
    const b=f.querySelector('button'),err=f.querySelector('.err');
    b.disabled=true;b.textContent='Signing in…';err.textContent='';
    const {error}=await sb.auth.signInWithPassword({email:val('email').trim(),password:val('password')});
    if(error){
      b.disabled=false;b.textContent='Sign in';
      err.textContent=/invalid/i.test(error.message)?'That email and password don’t match an account. Check them and try again.'
        :navigator.onLine?`Sign-in didn’t work: ${error.message}`:'You’re offline. Connect to the internet and try again.';
    }
    return;
  }
  const text=val('text').trim();if(!text)return;
  const goal=goalById(val('goal'))?val('goal'):null;
  const form=f.dataset.form;
  if(form==='tAdd'){if(todaySteps().length>=TODAY_MAX)return;state.steps.push(mkStep(text,goal,weekKey(),today()))}
  if(form==='wAdd'){state.steps.push(mkStep(text,goal,wk))}
  if(form==='sAdd'){state.steps.push(mkStep(text,f.dataset.goal))}
  if(form==='gAdd'){
    const ng={id:uid(),text,area:val('area'),why:'',due:'',done:false,doneDate:''};
    state.goals.push(ng);openGoals.clear();openGoals.add(ng.id);
    focusAfter=`[data-form="sAdd"][data-goal="${ng.id}"] input[name=text]`;
    save();render();toast('Goal added. Now add its first step.');return;
  }
  save();render();
  const again=app.querySelector(`[data-form="${form}"]${f.dataset.goal?`[data-goal="${f.dataset.goal}"]`:''} input[name=text]`);if(again)again.focus();
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.wbind){const w=state.weeks[wk]=state.weeks[wk]||{};w[t.dataset.wbind]=t.value;save()}
  if(t.dataset.gbind&&(t.dataset.gbind==='text'||t.dataset.gbind==='why')){const g=goalById(t.dataset.id);if(g){if(t.dataset.gbind==='why'||t.value.trim())g[t.dataset.gbind]=t.value;save()}}
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-goalsel]'))lastGoal=t.value;
  if(t.dataset.gbind){
    const g=goalById(t.dataset.id);if(!g)return;
    if(t.dataset.gbind==='text'){g.text=t.value.trim()||g.text}else g[t.dataset.gbind]=t.value;
    save();render();
  }
});

/* ---------- settings and backup ---------- */
$('#nameField').addEventListener('input',e=>{state.name=e.target.value.trim();save();render()});
$('#exportBtn').addEventListener('click',()=>{
  const {meta,...data}=state;
  const blob=new Blob([JSON.stringify({app:'the-study',exported:new Date().toISOString(),...data},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`the-study-backup-${today()}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  let data=null;try{data=normalize(JSON.parse(await file.text()))}catch(err){}
  if(!data){toast('That file isn’t a backup from The Study.');return}
  if(!confirm('Replace everything here with this backup? What’s here now will be overwritten.'))return;
  data.meta.owner=user?user.id:null;state=data;save();fillSettings();render();toast('Backup restored.');
});
$('#signOutBtn').addEventListener('click',async()=>{
  if(!confirm('Sign out? Your plans stay in your account and are cleared from this device.'))return;
  await pushNow();
  if(syncState!=='synced'&&!confirm('Some recent changes haven’t reached your account yet. Sign out anyway and lose them?'))return;
  try{await sb.auth.signOut({scope:'local'})}catch(e){}
  try{localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY)}catch(e){}
  state=fresh();user=null;showSignIn();
});

/* ---------- keeping things current ---------- */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||mode!=='app')return;
  render();syncNow();
});
window.addEventListener('online',()=>{if(user)syncNow()});
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}});

/* ---------- start ---------- */
function onAuth(event,session){
  const u=session&&session.user;
  if(!u){if(event==='INITIAL_SESSION'||event==='SIGNED_OUT'){user=null;showSignIn()}return}
  if(user&&user.id===u.id)return;
  user=u;
  if(state.meta.owner&&state.meta.owner!==u.id)state=fresh();
  state.meta.owner=u.id;save(false);
  showApp();syncNow();
}
(function boot(){
  if(!CLOUD){showApp();setStatus('local');return}
  if(!window.supabase){
    if(state.meta.owner){showApp();setStatus('offline')}
    else showSignIn('Couldn’t load the sign-in service. Check your connection and reload.');
    return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  sb.auth.onAuthStateChange((event,session)=>setTimeout(()=>onAuth(event,session),0));
})();
</script>
</body>
